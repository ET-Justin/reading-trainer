<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Reading Trainer</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <style>

    /* =====================================================
       PAGE / LAUNCHER
       ===================================================== */

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
    }

    .page-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .launcher-container {
      width: 100%;
      max-width: 620px;

      margin: 0 auto;

      padding: 20px 16px 30px;

      flex: 1;

      display: flex;
      align-items: center;
    }

    .launcher-screen {
      width: 100%;
    }

    .launcher-title {
      margin: 5px 0 6px;

      text-align: center;

      font-size: 1.85rem;
      font-weight: 800;
    }

    .launcher-subtitle {
      margin-bottom: 24px;

      text-align: center;

      color: #666;
    }

    .launcher-card {
      width: 100%;

      padding: 22px;

      margin-bottom: 16px;

      background: #fff;

      border-radius: 20px;

      box-shadow:
        0 4px 16px
        rgba(0, 0, 0, 0.07);
    }

    .launcher-grid {
      display: grid;
      gap: 12px;
    }

    .launcher-button,
    .launcher-back {
      width: 100%;

      border: none;
      border-radius: 14px;

      padding: 15px 12px;

      font-size: 1rem;
      font-weight: 700;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .launcher-button {
      background: #e9eef9;
      color: #222;
    }

    .launcher-back {
      background: #eef1f6;
      color: #444;
    }

    .launcher-button:active,
    .launcher-back:active {
      transform: scale(0.98);
    }

    @media (hover: hover) and (pointer: fine) {

      .launcher-button:hover {
        background: #dde5f5;
      }

      .launcher-back:hover {
        background: #e4e8ef;
      }
    }

    .launcher-loading {
      padding: 18px 0;

      text-align: center;

      color: #777;

      font-size: 0.9rem;
    }

    .launcher-note {
      padding: 6px 2px;

      color: #777;

      font-size: 0.88rem;
      line-height: 1.55;

      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    footer {
      width: 100%;

      padding: 12px 16px 20px;

      text-align: center;

      color: #999;

      font-size: 0.75rem;
      line-height: 1.55;
    }

    @media (max-width: 430px) {

      .launcher-title {
        font-size: 1.55rem;
      }
    }

  </style>

</head>


<body>

<div class="page-wrapper">


  <!-- =====================================================
       GRADE / LESSON LAUNCHER
       ===================================================== -->

  <div
    class="launcher-container"
    id="launcherContainer"
  >


    <!-- GRADE SELECT -->

    <section
      id="gradeScreen"
      class="launcher-screen"
    >

      <h1 class="launcher-title">
        📖 Reading Trainer
      </h1>

      <div class="launcher-subtitle">
        Choose Your Grade
      </div>


      <div class="launcher-card launcher-grid">

        <button
          type="button"
          class="launcher-button"
          onclick="selectGrade(1)"
        >
          Grade 1
        </button>

        <button
          type="button"
          class="launcher-button"
          onclick="selectGrade(2)"
        >
          Grade 2
        </button>

        <button
          type="button"
          class="launcher-button"
          onclick="selectGrade(3)"
        >
          Grade 3
        </button>

      </div>

    </section>



    <!-- LESSON SELECT -->

    <section
      id="lessonScreen"
      class="launcher-screen hidden"
    >

      <h1
        class="launcher-title"
        id="gradeTitle"
      ></h1>

      <div class="launcher-subtitle">
        Choose a Lesson
      </div>


      <div class="launcher-card">

        <div
          id="lessonLoading"
          class="launcher-loading"
        >
          🔎 Looking for lessons...
        </div>

        <div
          id="lessonButtons"
          class="launcher-grid"
        ></div>

      </div>


      <button
        type="button"
        class="launcher-back"
        onclick="backToGrades()"
      >
        ← Back to Grade
      </button>

    </section>

  </div>



  <!-- =====================================================
       READING TRAINER APP
       app.js renders into this area
       ===================================================== -->

  <main
    id="app"
    class="hidden"
  ></main>



  <!-- =====================================================
       FOOTER
       ===================================================== -->

  <footer>

    Developed by sungminpark@gne.go.kr with ChatGPT, 2026

    <span
      id="sourceLine"
      class="hidden"
    >
      <br>
      (Source: 중학교 영어(천재교과서, 이상기, 2022))
    </span>

  </footer>

</div>



<script>

/* =========================================================
   CONFIG
   ========================================================= */

const MAX_LESSON_NUMBER = 20;

let selectedGrade = null;


/* =========================================================
   URL STATE
   ========================================================= */

function getUrlSelection() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const grade =
    Number(
      params.get("grade")
    );


  const lesson =
    Number(
      params.get("lesson")
    );


  if (
    grade >= 1 &&
    grade <= 3 &&
    lesson >= 1
  ) {

    return {
      grade,
      lesson
    };
  }


  return null;
}


/* =========================================================
   SOURCE DISPLAY
   ========================================================= */

function showSource(show) {

  const source =
    document.getElementById(
      "sourceLine"
    );


  if (!source) {
    return;
  }


  source.classList.toggle(
    "hidden",
    !show
  );
}


/* =========================================================
   GRADE SCREEN
   ========================================================= */

function showGradeScreen() {

  selectedGrade = null;


  document
    .getElementById(
      "gradeScreen"
    )
    .classList.remove(
      "hidden"
    );


  document
    .getElementById(
      "lessonScreen"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "launcherContainer"
    )
    .classList.remove(
      "hidden"
    );


  document
    .getElementById(
      "app"
    )
    .classList.add(
      "hidden"
    );


  showSource(false);
}


/* =========================================================
   LESSON SCREEN
   ========================================================= */

function showLessonScreen(
  grade
) {

  selectedGrade =
    grade;


  document
    .getElementById(
      "gradeScreen"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "lessonScreen"
    )
    .classList.remove(
      "hidden"
    );


  document
    .getElementById(
      "launcherContainer"
    )
    .classList.remove(
      "hidden"
    );


  document
    .getElementById(
      "app"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "gradeTitle"
    )
    .textContent =
      `Grade ${grade}`;


  showSource(true);
}


/* =========================================================
   SELECT GRADE
   ========================================================= */

function selectGrade(grade) {

  history.pushState(
    {
      screen: "lessons",
      grade
    },
    "",
    window.location.pathname
  );


  showLessonScreen(
    grade
  );


  discoverLessons(
    grade
  );
}


/* =========================================================
   BACK TO GRADES
   ========================================================= */

function backToGrades() {

  history.pushState(
    {
      screen: "grades"
    },
    "",
    window.location.pathname
  );


  showGradeScreen();
}


/* =========================================================
   CSV PATH
   ========================================================= */

/*

  Normal Lesson
  data/2022M1L05R.csv

  Special Lesson
  data/2022M1L09R_SL.csv

*/

function getReadingCsvPath(
  grade,
  lesson,
  special = false
) {

  const lessonNumber =
    String(lesson)
      .padStart(
        2,
        "0"
      );


  return (
    `data/2022M${grade}` +
    `L${lessonNumber}R` +
    `${special ? "_SL" : ""}.csv`
  );
}


/* =========================================================
   DISCOVER LESSONS
   ========================================================= */

async function discoverLessons(
  grade
) {

  const loading =
    document.getElementById(
      "lessonLoading"
    );


  const buttons =
    document.getElementById(
      "lessonButtons"
    );


  loading.classList.remove(
    "hidden"
  );


  buttons.innerHTML =
    "";


  const checks =
    [];


  for (
    let lesson = 1;
    lesson <= MAX_LESSON_NUMBER;
    lesson++
  ) {

    checks.push(
      checkLessonExists(
        grade,
        lesson
      )
    );
  }


  const results =
    await Promise.all(
      checks
    );


  const foundLessons =
    [];


  results.forEach(
    (
      result,
      index
    ) => {

      if (
        result.exists
      ) {

        foundLessons.push({
          lesson:
            index + 1,

          special:
            result.special
        });
      }
    }
  );


  loading.classList.add(
    "hidden"
  );


  renderLessonButtons(
    grade,
    foundLessons
  );
}


/* =========================================================
   CHECK CSV EXISTENCE
   ========================================================= */

async function checkLessonExists(
  grade,
  lesson
) {

  /*
    1. 먼저 일반 Lesson 확인
  */

  const normalPath =
    getReadingCsvPath(
      grade,
      lesson,
      false
    );


  try {

    const response =
      await fetch(
        normalPath,
        {
          cache:
            "no-store"
        }
      );


    if (
      response.ok
    ) {

      return {
        exists:
          true,

        special:
          false
      };
    }

  } catch (error) {

    /*
      일반 파일이 없으면
      Special Lesson 확인으로 진행
    */
  }


  /*
    2. Special Lesson 확인
  */

  const specialPath =
    getReadingCsvPath(
      grade,
      lesson,
      true
    );


  try {

    const response =
      await fetch(
        specialPath,
        {
          cache:
            "no-store"
        }
      );


    if (
      response.ok
    ) {

      return {
        exists:
          true,

        special:
          true
      };
    }

  } catch (error) {

    /*
      둘 다 없음
    */
  }


  return {
    exists:
      false,

    special:
      false
  };
}


/* =========================================================
   RENDER LESSON BUTTONS
   ========================================================= */

function renderLessonButtons(
  grade,
  lessons
) {

  const box =
    document.getElementById(
      "lessonButtons"
    );


  box.innerHTML =
    "";


  if (
    !lessons.length
  ) {

    box.innerHTML = `
      <div class="launcher-note">
        아직 등록된 Lesson이 없습니다.
      </div>
    `;


    return;
  }


  lessons.forEach(
    item => {

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "launcher-button";


      /*
        _SL.csv 파일이면 학생에게는
        Special Lesson으로 표시
      */

      button.textContent =
        item.special
          ? "Special Lesson"
          : `Lesson ${item.lesson}`;


      button.addEventListener(
        "click",
        () => {

          openLesson(
            grade,
            item.lesson
          );
        }
      );


      box.appendChild(
        button
      );
    }
  );
}
  
/* =========================================================
   OPEN LESSON
   ========================================================= */

function openLesson(
  grade,
  lesson
) {

  const url =
    new URL(
      window.location.href
    );


  url.search = "";
  url.hash = "";


  url.searchParams.set(
    "grade",
    grade
  );


  url.searchParams.set(
    "lesson",
    lesson
  );


  window.location.href =
    url.pathname +
    url.search;
}


/* =========================================================
   BROWSER BACK / FORWARD
   ========================================================= */

window.addEventListener(
  "popstate",
  () => {

    const selection =
      getUrlSelection();


    if (selection) {

      window.location.reload();

      return;
    }


    const state =
      history.state;


    if (
      state &&
      state.screen === "lessons" &&
      state.grade
    ) {

      showLessonScreen(
        state.grade
      );


      discoverLessons(
        state.grade
      );


      return;
    }


    showGradeScreen();
  }
);


/* =========================================================
   INITIAL LAUNCHER STATE
   ========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    const selection =
      getUrlSelection();


    /*
      Grade + Lesson already selected.

      app.js will initialize the real
      Reading Trainer.
    */

    if (selection) {

      document
        .getElementById(
          "launcherContainer"
        )
        .classList.add(
          "hidden"
        );


      document
        .getElementById(
          "app"
        )
        .classList.remove(
          "hidden"
        );


      showSource(false);

      return;
    }


    /*
      Initial screen
    */

    showGradeScreen();
  }
);

</script>


<!-- =======================================================
     READING TRAINER
     Always loaded.
     app.js itself decides whether grade/lesson are selected.
     ======================================================= -->

<script src="js/app.js"></script>


</body>
</html>
