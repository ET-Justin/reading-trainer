<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Reading Trainer</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <style>

    /* =====================================================
       GRADE / LESSON SELECTOR
       ===================================================== */

    .page-wrapper {
      min-height: 100vh;

      display: flex;
      flex-direction: column;
    }


    .launcher-container {
      width: 100%;
      max-width: 620px;

      margin: 0 auto;

      padding: 20px 16px 30px;

      flex: 1;

      display: flex;
      align-items: center;
    }


    .launcher-screen {
      width: 100%;
    }


    .launcher-title {
      margin: 5px 0 6px;

      text-align: center;

      font-size: 1.85rem;
      font-weight: 800;
    }


    .launcher-subtitle {
      margin-bottom: 24px;

      text-align: center;

      color: #666;
    }


    .launcher-card {
      width: 100%;

      padding: 22px;

      margin-bottom: 16px;

      background: #fff;

      border-radius: 20px;

      box-shadow:
        0 4px 16px
        rgba(0, 0, 0, 0.07);
    }


    .launcher-grid {
      display: grid;

      gap: 12px;
    }


    .launcher-button {
      width: 100%;

      padding: 15px 12px;

      border: none;
      border-radius: 14px;

      background: #e9eef9;

      color: #222;

      font-size: 1rem;
      font-weight: 700;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }


    .launcher-button:active {
      transform: scale(0.98);
    }


    @media (hover: hover) and (pointer: fine) {

      .launcher-button:hover {
        background: #dde5f5;
      }

    }


    .launcher-back {
      width: 100%;

      padding: 14px 12px;

      border: none;
      border-radius: 14px;

      background: #eef1f6;

      color: #444;

      font-size: 0.95rem;
      font-weight: 700;

      cursor: pointer;
    }


    .launcher-loading {
      padding: 18px 0;

      text-align: center;

      color: #777;

      font-size: 0.9rem;
    }


    .launcher-note {
      padding: 6px 2px;

      color: #777;

      font-size: 0.88rem;
      line-height: 1.55;

      text-align: center;
    }


    .hidden {
      display: none !important;
    }


    footer {
      width: 100%;

      padding: 12px 16px 20px;

      text-align: center;

      color: #999;

      font-size: 0.75rem;
      line-height: 1.55;
    }


    #sourceLine {
      display: inline;
    }


    @media (max-width: 430px) {

      .launcher-title {
        font-size: 1.55rem;
      }

    }

  </style>

</head>


<body>

<div class="page-wrapper">


  <!-- =====================================================
       GRADE / LESSON LAUNCHER
       ===================================================== -->

  <div
    class="launcher-container"
    id="launcherContainer"
  >


    <!-- GRADE SELECT -->

    <section
      id="gradeScreen"
      class="launcher-screen"
    >

      <h1 class="launcher-title">
        📖 Reading Trainer
      </h1>

      <div class="launcher-subtitle">
        Choose Your Grade
      </div>


      <div class="launcher-card launcher-grid">

        <button
          type="button"
          class="launcher-button"
          onclick="selectGrade(1)"
        >
          Grade 1
        </button>


        <button
          type="button"
          class="launcher-button"
          onclick="selectGrade(2)"
        >
          Grade 2
        </button>


        <button
          type="button"
          class="launcher-button"
          onclick="selectGrade(3)"
        >
          Grade 3
        </button>

      </div>

    </section>



    <!-- LESSON SELECT -->

    <section
      id="lessonScreen"
      class="launcher-screen hidden"
    >

      <h1
        class="launcher-title"
        id="gradeTitle"
      >
      </h1>


      <div class="launcher-subtitle">
        Choose a Lesson
      </div>


      <div class="launcher-card">

        <div
          id="lessonLoading"
          class="launcher-loading"
        >
          🔎 Looking for lessons...
        </div>


        <div
          id="lessonButtons"
          class="launcher-grid"
        >
        </div>

      </div>


      <button
        type="button"
        class="launcher-back"
        onclick="backToGrades()"
      >
        ← Back to Grade
      </button>

    </section>

  </div>



  <!-- =====================================================
       READING TRAINER APP
       app.js가 이 영역을 사용
       ===================================================== -->

  <main
    id="app"
    class="hidden"
  >
  </main>



  <!-- =====================================================
       FOOTER
       ===================================================== -->

  <footer>

    Developed by sungminpark@gne.go.kr with ChatGPT, 2026

    <span
      id="sourceLine"
      class="hidden"
    >
      <br>
      (Source: 중학교 영어(천재교과서, 이상기, 2022))
    </span>

  </footer>

</div>



<script>

/* =========================================================
   CONFIG
   ========================================================= */

const MAX_LESSON_NUMBER = 20;

let selectedGrade = null;


/* =========================================================
   URL
   ========================================================= */

function getUrlSelection() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const grade =
    Number(
      params.get("grade")
    );


  const lesson =
    Number(
      params.get("lesson")
    );


  if (
    grade >= 1 &&
    grade <= 3 &&
    lesson >= 1
  ) {

    return {
      grade,
      lesson
    };
  }


  return null;
}


/* =========================================================
   SCREEN
   ========================================================= */

function showGradeScreen() {

  selectedGrade = null;


  document
    .getElementById(
      "gradeScreen"
    )
    .classList.remove(
      "hidden"
    );


  document
    .getElementById(
      "lessonScreen"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "launcherContainer"
    )
    .classList.remove(
      "hidden"
    );


  document
    .getElementById(
      "app"
    )
    .classList.add(
      "hidden"
    );


  showSource(false);
}


function showLessonScreen(
  grade
) {

  selectedGrade =
    grade;


  document
    .getElementById(
      "gradeScreen"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "lessonScreen"
    )
    .classList.remove(
      "hidden"
    );


  document
    .getElementById(
      "launcherContainer"
    )
    .classList.remove(
      "hidden"
    );


  document
    .getElementById(
      "app"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "gradeTitle"
    )
    .textContent =
      `Grade ${grade}`;


  showSource(true);
}


function showSource(show) {

  const source =
    document.getElementById(
      "sourceLine"
    );


  source.classList.toggle(
    "hidden",
    !show
  );
}


/* =========================================================
   GRADE
   ========================================================= */

function selectGrade(grade) {

  showLessonScreen(
    grade
  );


  discoverLessons(
    grade
  );
}


function backToGrades() {

  history.pushState(
    {
      screen: "grades"
    },
    "",
    window.location.pathname
  );


  showGradeScreen();
}


/* =========================================================
   CSV FILE NAME
   ========================================================= */

/*

  Example:

  Grade 1
  Lesson 5

  →

  data/2022M1L05R.csv

*/


function getReadingCsvPath(
  grade,
  lesson
) {

  const lessonNumber =
    String(lesson)
      .padStart(
        2,
        "0"
      );


  return (
    `data/2022M${grade}` +
    `L${lessonNumber}R.csv`
  );
}


/* =========================================================
   LESSON DISCOVERY
   ========================================================= */

async function discoverLessons(
  grade
) {

  const loading =
    document.getElementById(
      "lessonLoading"
    );


  const buttons =
    document.getElementById(
      "lessonButtons"
    );


  loading.classList.remove(
    "hidden"
  );


  buttons.innerHTML = "";


  const checks = [];


  for (
    let lesson = 1;
    lesson <= MAX_LESSON_NUMBER;
    lesson++
  ) {

    checks.push(
      checkLessonExists(
        grade,
        lesson
      )
    );
  }


  const results =
    await Promise.all(
      checks
    );


  const found = [];


  results.forEach(
    (
      exists,
      index
    ) => {

      if (exists) {

        found.push(
          index + 1
        );
      }
    }
  );


  loading.classList.add(
    "hidden"
  );


  renderLessonButtons(
    grade,
    found
  );
}


/* =========================================================
   CHECK FILE
   ========================================================= */

async function checkLessonExists(
  grade,
  lesson
) {

  const path =
    getReadingCsvPath(
      grade,
      lesson
    );


  try {

    const response =
      await fetch(
        path,
        {
          cache: "no-store"
        }
      );


    return response.ok;

  } catch (error) {

    return false;
  }
}


/* =========================================================
   LESSON BUTTONS
   ========================================================= */

function renderLessonButtons(
  grade,
  lessons
) {

  const box =
    document.getElementById(
      "lessonButtons"
    );


  box.innerHTML = "";


  if (!lessons.length) {

    box.innerHTML = `
      <div class="launcher-note">
        아직 등록된 Lesson이 없습니다.
      </div>
    `;

    return;
  }


  lessons.forEach(
    lesson => {

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "launcher-button";


      button.textContent =
        `Lesson ${lesson}`;


      button.addEventListener(
        "click",
        () => {

          openLesson(
            grade,
            lesson
          );
        }
      );


      box.appendChild(
        button
      );
    }
  );
}


/* =========================================================
   OPEN LESSON
   ========================================================= */

function openLesson(
  grade,
  lesson
) {

  const url =
    new URL(
      window.location.href
    );


  url.search = "";

  url.hash = "";


  url.searchParams.set(
    "grade",
    grade
  );


  url.searchParams.set(
    "lesson",
    lesson
  );


  window.location.href =
    url.pathname +
    url.search;
}


/* =========================================================
   BROWSER HISTORY
   ========================================================= */

window.addEventListener(
  "popstate",
  () => {

    const selection =
      getUrlSelection();


    if (selection) {

      window.location.reload();

      return;
    }


    showGradeScreen();
  }
);


/* =========================================================
   START
   ========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    const selection =
      getUrlSelection();


    if (selection) {

      /*
        실제 Reading Trainer는
        app.js가 렌더링한다.
      */

      document
        .getElementById(
          "launcherContainer"
        )
        .classList.add(
          "hidden"
        );


      document
        .getElementById(
          "app"
        )
        .classList.remove(
          "hidden"
        );


      showSource(false);


      loadReadingTrainer();

      return;
    }


    showGradeScreen();
  }
);


/* =========================================================
   LOAD APP.JS
   ========================================================= */

function loadReadingTrainer() {

  const script =
    document.createElement(
      "script"
    );


  script.src =
    "js/app.js";


  script.defer =
    true;


  document.body.appendChild(
    script
  );
}

</script>


</body>
</html>
